# Kobo — verificación en cada push/PR: typecheck, tests y build.
# Los tests del servidor son unitarios (esquemas y lógica pura): no necesitan Mongo.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Un PR con varios pushes seguidos cancela las ejecuciones anteriores.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
